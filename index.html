<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Écran d'Annonces - Collège EL JEM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="school-info">
            <div class="school-name">🎓 Collège EL JEM</div>
            <div class="school-subtitle">Tableau d'Annonces</div>
        </div>
        <div class="datetime">
            <div id="time"></div>
            <div id="date"></div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="announcements-header">
            <h1>📢 Annonces du Jour</h1>
        </div>

        <div id="announcements-container" class="announcements-grid">
            <!-- Announcements will be dynamically loaded here -->
        </div>

        <div id="no-announcements" class="no-announcements" style="display: none;">
            <div class="empty-state">
                <div class="empty-icon">📭</div>

                <p>Les nouvelles annonces apparaîtront ici automatiquement</p>
            </div>
        </div>
    </div>

    <!-- ADMIN ACCESS BUTTON (Hidden, click bottom-right corner 3 times) -->
    <div id="admin-trigger" class="admin-trigger"></div>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدرسة الإعدادية الشابي بالجم</title>
    <!-- Import Cairo Font for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
</head>

<body>
    <!-- TOP BAR -->
    <div class="header">
        <div class="logo-section">
            <div class="logo-icon">🏫</div>
            <div>
                <h1>المدرسة الإعدادية الشابي بالجم</h1>
                <p>لوحة الإعلانات الرسمية</p>
            </div>
        </div>
        <div class="datetime">
            <div id="time">--:--</div>
            <div id="date">-- --- ----</div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h2 class="section-title">📢 إعلانات اليوم</h2>

        <div id="announcements-container" class="announcements-grid">
            <!-- Announcements will be dynamically loaded here -->
        </div>

        <div id="no-announcements"
            style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 50px; text-align: center; color: #64748b;">
            <div style="font-size: 4rem; margin-bottom: 20px; opacity: 0.5;">📭</div>
            <h2 style="font-size: 1.5rem; margin-bottom: 10px;">لا توجد إعلانات حالياً</h2>
            <p style="font-size: 1rem; opacity: 0.8;">الإعلانات الجديدة ستظهر هنا تلقائياً</p>
        </div>
    </div>

    <!-- FLASH OVERLAY (Popup) -->
    <div id="flash-overlay" class="flash-overlay">
        <div class="flash-content">
            <div class="flash-icon-container">
                <span class="flash-icon">⚡</span>
            </div>
            <h1 id="flash-title-display">عنوان الومضة</h1>
            <p id="flash-message-display">نص الرسالة العاجلة يظهر هنا...</p>
        </div>
    </div>

    <!-- ADMIN ACCESS BUTTON (Hidden, click bottom-right corner 3 times) -->
    <div id="admin-trigger" class="admin-trigger"></div>

    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>

</html>

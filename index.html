<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدرسة الإعدادية الشابي بالجم</title>
    <!-- Import Cairo Font for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
</head>

<body>
    <!-- TOP BAR -->
    <div class="header">
        <div class="logo-section">
            <div class="logo-icon">🏫</div>
            <div>
                <h1>المدرسة الإعدادية الشابي بالجم</h1>
                <p>لوحة الإعلانات الرسمية</p>
            </div>
        </div>
        <div class="datetime">
            <div id="time">--:--</div>
            <div id="date">-- --- ----</div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="announcements-header">
            <h1>📢 Annonces du Jour</h1>
        </div>

        <div id="announcements-container" class="announcements-grid">
            <!-- Announcements will be dynamically loaded here -->
        </div>

        <div id="no-announcements" class="no-announcements" style="display: none;">
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <h2>Aucune annonce pour le moment</h2>
                <p>Les nouvelles annonces apparaîtront ici automatiquement</p>
            </div>
        </div>
    </div>

    <!-- ADMIN ACCESS BUTTON (Hidden, click bottom-right corner 3 times) -->
    <div id="admin-trigger" class="admin-trigger"></div>

    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>

</html>
